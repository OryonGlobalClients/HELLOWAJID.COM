    <aside aria-label="WhatsApp Support">
      <style>
        .floating-wa-container {
          position: fixed;
          bottom: 24px;
          right: 24px;
          z-index: 999999;
          display: flex;
          align-items: center;
          text-decoration: none;
          font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .floating-wa-tooltip {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          margin-right: 12px;
          padding: 8px 16px;
          background: rgba(10, 24, 16, 0.95);
          border: 1px solid rgba(74, 222, 128, 0.45);

          font-weight: 600;
          border-radius: 9999px;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
          opacity: 0;
          transform: translateX(10px);
          transition: opacity 0.25s ease, transform 0.25s ease;
          pointer-events: none;
          white-space: nowrap;
          backdrop-filter: blur(8px);
          -webkit-backdrop-filter: blur(8px);
        }
        .floating-wa-container:hover .floating-wa-tooltip {
          opacity: 1;
          transform: translateX(0);
        }
        .floating-wa-dot {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: #25D366;
          display: inline-block;
          box-shadow: 0 0 8px #25D366;
        }
        .floating-wa-phone {
          color: #4ade80;
          font-family: monospace;
          font-size: 12px;
        }
        .floating-wa-btn {
          position: relative;
          width: 60px;
          height: 60px;
          border-radius: 50%;
          background-color: #25D366;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 25px rgba(37, 211, 102, 0.5);
          border: 2.5px solid rgba(255, 255, 255, 0.35);
          transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, box-shadow 0.3s ease;
          cursor: pointer;
        }
        .floating-wa-container:hover .floating-wa-btn {
          transform: scale(1.12);
          background-color: #20ba5a;
          box-shadow: 0 14px 35px rgba(0, 0, 0, 0.6), 0 0 35px rgba(37, 211, 102, 0.7);
        }
        .floating-wa-container:active .floating-wa-btn {
          transform: scale(0.95);
        }
        .floating-wa-btn::before {
          content: '';
          position: absolute;
          inset: -6px;
          border-radius: 50%;
          background: #25D366;
          opacity: 0.4;
          z-index: -1;
          animation: wa-pulse-ring 2.2s cubic-bezier(0, 0, 0.2, 1) infinite;
        }
        @keyframes wa-pulse-ring {
          0% { transform: scale(0.92); opacity: 0.7; }
          70%, 100% { transform: scale(1.4); opacity: 0; }
        }
        @media (max-width: 640px) {
          .floating-wa-container {
            bottom: 20px;
            right: 20px;
          }
          .floating-wa-btn {
            width: 56px;
            height: 56px;
          }
          .floating-wa-tooltip {
            display: none;
          }
        }
